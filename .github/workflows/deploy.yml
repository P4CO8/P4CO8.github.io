name: Deploy to GitHub Pages

on:
  # Ejecuta el workflow cada vez que haces cambios en la rama main
  push:
    branches: [ main ]

  # Permite ejecutarlo manualmente desde la pestaña Actions
  workflow_dispatch:

# Permisos necesarios para publicar en GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Descarga el contenido de tu repositorio
      - name: Checkout your repository using git
        uses: actions/checkout@v4

      # Instala dependencias, construye el proyecto Astro y lo prepara
      # para GitHub Pages
      - name: Install, build, and upload your site
        uses: withastro/action@v3
        with:
          node-version: 22

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # Publica el sitio en GitHub Pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4